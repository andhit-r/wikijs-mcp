[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wikijs-mcp"
version = "0.3.0"
description = "MCP server untuk mengakses Wiki.js melalui GraphQL API, dibangun dengan FastMCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "andhit-r", email = "andhitia.r@gmail.com" }]
keywords = ["wikijs", "wiki", "mcp", "fastmcp", "graphql", "knowledge-base"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "fastmcp>=3.3,<4",
    "httpx>=0.28,<0.29",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
]

[project.scripts]
wikijs-mcp = "wikijs_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/andhit-r/wikijs-mcp"
Repository = "https://github.com/andhit-r/wikijs-mcp"
Issues = "https://github.com/andhit-r/wikijs-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wikijs_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
